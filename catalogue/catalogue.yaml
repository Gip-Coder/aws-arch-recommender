# Curated service allow-list and verified pricing model.
# Region: ap-south-1 (Asia Pacific - Mumbai)
# Pricing: unit prices, usage assumptions, and official source URLs.
# Verification Date: 2026-10-25
version: 0.1
region: ap-south-1
prices_checked_on: "2026-10-25"
services:
  CloudFront:
    category: network
    allowed_targets: [ApplicationLoadBalancer, S3, APIGateway]
    pricing:
      unit_price: 0.109
      unit: "USD per GB data transfer out & per 10k HTTPS requests"
      currency: "USD"
      region_scope: "regional_edge"
      status: "verified"
      source_url: "https://aws.amazon.com/cloudfront/pricing/"
      components:
        - name: "Data Transfer Out to Internet (India Edge)"
          unit_price: 0.109
          unit: "USD per GB"
          low_quantity: 100
          high_quantity: 1000
        - name: "HTTPS Requests (India Edge)"
          unit_price: 0.0000012
          unit: "USD per request"
          low_quantity: 1000000
          high_quantity: 10000000
      usage_assumptions:
        description: "100 GB DTO + 1M HTTPS reqs (low) to 1,000 GB DTO + 10M HTTPS reqs (high)"

  Route53:
    category: network
    allowed_targets: [CloudFront, ApplicationLoadBalancer]
    pricing:
      unit_price: 0.50
      unit: "USD per hosted zone-month & per million queries"
      currency: "USD"
      region_scope: "global"
      status: "verified"
      source_url: "https://aws.amazon.com/route53/pricing/"
      components:
        - name: "Hosted Zone (first 25)"
          unit_price: 0.50
          unit: "USD per hosted zone-month"
          low_quantity: 1
          high_quantity: 1
        - name: "Standard DNS Queries"
          unit_price: 0.0000004
          unit: "USD per query"
          low_quantity: 1000000
          high_quantity: 10000000
      usage_assumptions:
        description: "1 hosted zone + 1M standard queries (low) to 1 hosted zone + 10M queries (high)"

  ApplicationLoadBalancer:
    category: network
    allowed_targets: [EC2AutoScalingGroup, ECSFargate]
    pricing:
      unit_price: 0.0239
      unit: "USD per ALB-hour and LCU-hour"
      currency: "USD"
      region_scope: "ap-south-1"
      status: "verified"
      source_url: "https://aws.amazon.com/elasticloadbalancing/pricing/"
      components:
        - name: "ALB Instance Hours"
          unit_price: 0.0239
          unit: "USD per ALB-hour"
          low_quantity: 730
          high_quantity: 730
        - name: "Load Balancer Capacity Units (LCU)"
          unit_price: 0.008
          unit: "USD per LCU-hour"
          low_quantity: 730
          high_quantity: 2190
      usage_assumptions:
        description: "730 ALB-hrs + 1 LCU (low, 730 LCU-hrs) to 3 LCUs (high, 2190 LCU-hrs)"

  APIGateway:
    category: network
    allowed_targets: [Lambda, Cognito]
    pricing:
      unit_price: 1.05
      unit: "USD per million requests (HTTP API)"
      currency: "USD"
      region_scope: "ap-south-1"
      status: "verified"
      source_url: "https://aws.amazon.com/api-gateway/pricing/"
      usage_assumptions:
        low_quantity: 5
        high_quantity: 25
        unit: "million requests"
        description: "HTTP API: 5M requests (low) to 25M requests (high)"

  EC2AutoScalingGroup:
    category: compute
    allowed_targets: [RDS, RDS_MultiAZ, DynamoDB, S3, ElastiCache]
    pricing:
      unit_price: 0.0112
      unit: "USD per instance-hour (t3.micro Linux)"
      currency: "USD"
      region_scope: "ap-south-1"
      status: "verified"
      source_url: "https://aws.amazon.com/ec2/pricing/on-demand/"
      usage_assumptions:
        low_quantity: 730
        high_quantity: 1460
        unit: "instance-hours"
        description: "730h 1 instance (low) to 1460h 2 instances (high) t3.micro Linux On-Demand"

  ECSFargate:
    category: compute
    allowed_targets: [RDS, RDS_MultiAZ, DynamoDB, S3]
    pricing:
      unit_price: 0.04256
      unit: "USD per vCPU-hour and GB-hour"
      currency: "USD"
      region_scope: "ap-south-1"
      status: "verified"
      source_url: "https://aws.amazon.com/fargate/pricing/"
