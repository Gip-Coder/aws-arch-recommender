# Curated service allow-list and pricing model.
# Region: ap-south-1 (Asia Pacific - Mumbai)
# Pricing: unit prices, usage assumptions, and official source URLs.
# Unverified prices are explicitly set to null with TODO status.
version: 0.1
region: ap-south-1
prices_checked_on: "TODO"
services:
  CloudFront:
    category: network
    allowed_targets: [ApplicationLoadBalancer, S3, APIGateway]
    pricing:
      unit_price: null # TODO verify
      unit: "USD per GB data transfer out"
      currency: "USD"
      region_scope: "global"
      status: "TODO verify"
      source_url: "https://aws.amazon.com/cloudfront/pricing/"
      usage_assumptions:
        low_quantity: 100
        high_quantity: 1000
        unit: "GB"
        description: "100 GB transfer (low) to 1,000 GB transfer (high)"

  Route53:
    category: network
    allowed_targets: [CloudFront, ApplicationLoadBalancer]
