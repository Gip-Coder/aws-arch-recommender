      unit_price: null # TODO verify
      unit: "USD per hosted zone / million queries"
      currency: "USD"
      region_scope: "global"
      status: "TODO verify"
      source_url: "https://aws.amazon.com/route53/pricing/"
      usage_assumptions:
        low_quantity: 1
        high_quantity: 5
        unit: "hosted zones and query millions"
        description: "1 hosted zone, 1M queries (low) to 1 hosted zone, 5M queries (high)"

  ApplicationLoadBalancer:
